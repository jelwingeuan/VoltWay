name: VoltWay tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
    - uses: actions/checkout@v4
    - uses: supabase/setup-cli@v1
      with:
        version: 2.122.0
    - name: Start disposable database
      run: supabase db start
    - name: Verify legacy private-favorite backfill
      run: |
        supabase db reset --local --version 202609280004 --sql-paths fixtures/legacy_private_favorite.sql --yes
        supabase db query --local --file supabase/fixtures/assert_legacy_private_favorite_before.sql
        supabase migration up --local --yes
        supabase db query --local --file supabase/fixtures/assert_legacy_private_favorite_after.sql
    - name: Test favorite RLS and snapshot constraints
      run: |
        set -o pipefail
        supabase test db supabase/tests/private_favorite_storage.sql --local 2>&1 | tee "$RUNNER_TEMP/voltway-pgtap.txt"
        grep -Eq 'Files=1,[[:space:]]*Tests=10' "$RUNNER_TEMP/voltway-pgtap.txt"

  test:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Inspect Xcode and simulators
      run: |
        xcodebuild -version
        xcrun simctl list devices available
    - name: Run backend tests
      run: node --test supabase/functions/stations/*.test.mjs supabase/functions/sync-ocm/*.test.mjs supabase/functions/sync-mevnet/*.test.mjs
    - name: Run iOS tests
      run: xcodebuild -project VoltWay.xcodeproj -scheme VoltWay -destination 'platform=iOS Simulator,name=iPhone 18 Pro' -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/VoltWay.xcresult" CODE_SIGNING_ALLOWED=NO test
    - name: Preserve iOS test diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-test-results
        path: ${{ runner.temp }}/VoltWay.xcresult
        if-no-files-found: ignore
